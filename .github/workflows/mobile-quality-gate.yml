name: Mobile Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/release-hardening-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run mobile quality gate
        run: npm run quality-gate

      - name: Run Expo Doctor
        run: npm run doctor
